<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460" role="img" aria-labelledby="cc-visual-curve-pt-br-title" aria-describedby="cc-visual-curve-pt-br-desc" focusable="false" lang="pt-BR">
<title id="cc-visual-curve-pt-br-title">Exemplo de curva de controlador ao longo do tempo</title>
<desc id="cc-visual-curve-pt-br-desc">Um exemplo de CC7 tem quatro pontos com valores 100, 40, 70 e 110. O tempo avança da esquerda para a direita e o controle muda entre os pontos. São valores ilustrativos, não uma captura nem áudio medido.</desc>
<rect width="320" height="460" rx="8" fill="#1b1d21"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><text x="160" y="30" font-size="22" fill="#efc66c" font-weight="650" text-anchor="middle">Exemplo: CC7</text><text x="15" y="64" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="start">Valor</text><line x1="49" y1="92" x2="306" y2="92" stroke="#56524a" stroke-width="1" stroke-dasharray="3 5"/><text x="38" y="97" font-size="15" fill="#c0bbb2" font-weight="400" text-anchor="end">127</text><line x1="49" y1="206" x2="306" y2="206" stroke="#56524a" stroke-width="1" stroke-dasharray="3 5"/><text x="38" y="211" font-size="15" fill="#c0bbb2" font-weight="400" text-anchor="end">64</text><line x1="49" y1="322" x2="306" y2="322" stroke="#56524a" stroke-width="1" stroke-dasharray="3 5"/><text x="38" y="327" font-size="15" fill="#c0bbb2" font-weight="400" text-anchor="end">0</text><line x1="49" y1="80" x2="49" y2="322" stroke="#c0bbb2" stroke-width="1.5"/><line x1="49" y1="322" x2="306" y2="322" stroke="#c0bbb2" stroke-width="1.5"/><path d="M62 142 L140 250 L218 196 L296 124" fill="none" stroke="#efc66c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="62" cy="142" r="6" fill="#111214" stroke="#efc66c" stroke-width="3"/><text x="62" y="128" font-size="16" fill="#f2eee6" font-weight="650" text-anchor="middle">100</text><circle cx="140" cy="250" r="6" fill="#111214" stroke="#efc66c" stroke-width="3"/><text x="140" y="236" font-size="16" fill="#f2eee6" font-weight="650" text-anchor="middle">40</text><circle cx="218" cy="196" r="6" fill="#111214" stroke="#efc66c" stroke-width="3"/><text x="218" y="182" font-size="16" fill="#f2eee6" font-weight="650" text-anchor="middle">70</text><circle cx="296" cy="124" r="6" fill="#111214" stroke="#efc66c" stroke-width="3"/><text x="296" y="110" font-size="16" fill="#f2eee6" font-weight="650" text-anchor="middle">110</text><text x="49" y="348" font-size="15" fill="#c0bbb2" font-weight="400" text-anchor="start">Antes</text><text x="306" y="348" font-size="15" fill="#c0bbb2" font-weight="400" text-anchor="end">Depois</text><text x="178" y="347" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="middle">Tempo →</text><text x="160" y="386" font-size="18" fill="#f2eee6" font-weight="400" text-anchor="middle">Cada ponto define um valor</text><text x="160" y="410" font-size="18" fill="#f2eee6" font-weight="400" text-anchor="middle">para este controlador.</text><text x="160" y="430" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="middle">Conforme a música avança,</text><text x="160" y="454" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="middle">o valor segue a curva.</text></g>
</svg>
