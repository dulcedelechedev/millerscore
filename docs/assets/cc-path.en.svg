<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460" role="img" aria-labelledby="cc-visual-path-en-title" aria-describedby="cc-visual-path-en-desc" focusable="false" lang="en">
<title id="cc-visual-path-en-title">The MS Basic controller path</title>
<desc id="cc-visual-path-en-desc">108 editable controller numbers can be sent to MS Basic. The SoundFont instrument determines their effect. 20 protected controllers are never sent. Muse Sounds, VST3 and external MIDI do not support these generic lanes.</desc>
<rect width="320" height="460" rx="8" fill="#1b1d21"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="10" y="10" width="300" height="54" rx="10" fill="#1b1d21" stroke="#efc66c" stroke-width="1.5"/><text x="160" y="44" font-size="20" fill="#efc66c" font-weight="650" text-anchor="middle">108 editable CC lanes</text><line x1="160" y1="72" x2="160" y2="96" stroke="#efc66c" stroke-width="3"/><path d="M154 90 L160 97 L166 90" fill="none" stroke="#efc66c" stroke-width="3" stroke-linejoin="round"/><rect x="10" y="108" width="300" height="62" rx="10" fill="#1b1d21" stroke="#efc66c" stroke-width="1.5"/><text x="160" y="136" font-size="23" fill="#f2eee6" font-weight="650" text-anchor="middle">MS Basic</text><text x="160" y="160" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="middle">SoundFont playback</text><line x1="160" y1="180" x2="160" y2="204" stroke="#efc66c" stroke-width="3"/><path d="M154 198 L160 205 L166 198" fill="none" stroke="#efc66c" stroke-width="3" stroke-linejoin="round"/><rect x="10" y="218" width="300" height="54" rx="10" fill="#1b1d21" stroke="#efc66c" stroke-width="1.5"/><text x="160" y="252" font-size="20" fill="#f2eee6" font-weight="650" text-anchor="middle">Selected instrument</text><text x="160" y="300" font-size="18" fill="#c0bbb2" font-weight="400" text-anchor="middle">Its response depends</text><text x="160" y="324" font-size="18" fill="#c0bbb2" font-weight="400" text-anchor="middle">on the chosen sound.</text><rect x="10" y="344" width="300" height="56" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="160" y="368" font-size="18" fill="#f2eee6" font-weight="600" text-anchor="middle">20 protected controllers</text><text x="160" y="390" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="middle">Never sent</text><text x="160" y="425" font-size="15" fill="#c0bbb2" font-weight="400" text-anchor="middle">Other sources: no generic CC path</text><text x="160" y="446" font-size="14" fill="#c0bbb2" font-weight="400" text-anchor="middle">Muse Sounds · VST3 · External MIDI</text></g>
</svg>
