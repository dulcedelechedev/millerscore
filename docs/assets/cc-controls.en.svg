<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460" role="img" aria-labelledby="cc-visual-controls-en-title" aria-describedby="cc-visual-controls-en-desc" focusable="false" lang="en">
<title id="cc-visual-controls-en-title">Volume, expression, pan and sustain</title>
<desc id="cc-visual-controls-en-desc">CC7 changes instrument volume. CC11 shapes expression within a phrase. CC10 places sound left or right. CC64 is sustain: values 0 through 63 mean off, 64 through 127 mean on. Instrument support varies.</desc>
<rect width="320" height="460" rx="8" fill="#1b1d21"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="10" y="8" width="300" height="104" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5"/><text x="25" y="35" font-size="18" fill="#efc66c" font-weight="650" text-anchor="start">CC7</text><text x="85" y="35" font-size="18" fill="#f2eee6" font-weight="650" text-anchor="start">Volume</text><text x="25" y="60" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">Overall instrument level</text><line x1="28" y1="86" x2="291" y2="86" stroke="#56524a" stroke-width="7"/><line x1="28" y1="86" x2="203" y2="86" stroke="#efc66c" stroke-width="7"/><circle cx="203" cy="86" r="7" fill="#f2eee6"/><rect x="10" y="122" width="300" height="104" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5"/><text x="25" y="149" font-size="18" fill="#efc66c" font-weight="650" text-anchor="start">CC11</text><text x="85" y="149" font-size="18" fill="#f2eee6" font-weight="650" text-anchor="start">Expression</text><text x="25" y="174" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">Shape a phrase’s level</text><line x1="28" y1="200" x2="291" y2="200" stroke="#56524a" stroke-width="7"/><line x1="28" y1="200" x2="155" y2="200" stroke="#efc66c" stroke-width="7"/><circle cx="155" cy="200" r="7" fill="#f2eee6"/><rect x="10" y="236" width="300" height="104" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5"/><text x="25" y="263" font-size="18" fill="#efc66c" font-weight="650" text-anchor="start">CC10</text><text x="85" y="263" font-size="18" fill="#f2eee6" font-weight="650" text-anchor="start">Pan</text><text x="25" y="288" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">Place sound left or right</text><text x="26" y="320" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">L</text><text x="292" y="320" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="end">R</text><line x1="53" y1="314" x2="267" y2="314" stroke="#56524a" stroke-width="5"/><line x1="160" y1="305" x2="160" y2="323" stroke="#c0bbb2" stroke-width="1"/><circle cx="120" cy="314" r="7" fill="#efc66c"/><rect x="10" y="350" width="300" height="104" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5"/><text x="25" y="377" font-size="18" fill="#efc66c" font-weight="650" text-anchor="start">CC64</text><text x="85" y="377" font-size="18" fill="#f2eee6" font-weight="650" text-anchor="start">Sustain pedal</text><text x="25" y="402" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">Hold notes after release</text><text x="25" y="434" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="start">0–63 Off</text><text x="290" y="434" font-size="17" fill="#efc66c" font-weight="650" text-anchor="end">64–127 On</text></g>
</svg>
