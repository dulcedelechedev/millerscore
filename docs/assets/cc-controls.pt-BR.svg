<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460" role="img" aria-labelledby="cc-visual-controls-pt-br-title" aria-describedby="cc-visual-controls-pt-br-desc" focusable="false" lang="pt-BR">
<title id="cc-visual-controls-pt-br-title">Volume, expressão, panorama e sustentação</title>
<desc id="cc-visual-controls-pt-br-desc">CC7 muda o volume do instrumento. CC11 molda a expressão dentro de uma frase. CC10 posiciona o som à esquerda ou à direita. CC64 é sustain: de 0 a 63 significa desligado, de 64 a 127 significa ligado. O suporte depende do instrumento.</desc>
<rect width="320" height="460" rx="8" fill="#1b1d21"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="10" y="8" width="300" height="104" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5"/><text x="25" y="35" font-size="18" fill="#efc66c" font-weight="650" text-anchor="start">CC7</text><text x="85" y="35" font-size="18" fill="#f2eee6" font-weight="650" text-anchor="start">Volume</text><text x="25" y="60" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">Nível geral do instrumento</text><line x1="28" y1="86" x2="291" y2="86" stroke="#56524a" stroke-width="7"/><line x1="28" y1="86" x2="203" y2="86" stroke="#efc66c" stroke-width="7"/><circle cx="203" cy="86" r="7" fill="#f2eee6"/><rect x="10" y="122" width="300" height="104" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5"/><text x="25" y="149" font-size="18" fill="#efc66c" font-weight="650" text-anchor="start">CC11</text><text x="85" y="149" font-size="18" fill="#f2eee6" font-weight="650" text-anchor="start">Expressão</text><text x="25" y="174" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">Molde o nível da frase</text><line x1="28" y1="200" x2="291" y2="200" stroke="#56524a" stroke-width="7"/><line x1="28" y1="200" x2="155" y2="200" stroke="#efc66c" stroke-width="7"/><circle cx="155" cy="200" r="7" fill="#f2eee6"/><rect x="10" y="236" width="300" height="104" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5"/><text x="25" y="263" font-size="18" fill="#efc66c" font-weight="650" text-anchor="start">CC10</text><text x="85" y="263" font-size="18" fill="#f2eee6" font-weight="650" text-anchor="start">Panorama</text><text x="25" y="288" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">Posicione à esquerda ou direita</text><text x="26" y="320" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">E</text><text x="292" y="320" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="end">D</text><line x1="53" y1="314" x2="267" y2="314" stroke="#56524a" stroke-width="5"/><line x1="160" y1="305" x2="160" y2="323" stroke="#c0bbb2" stroke-width="1"/><circle cx="120" cy="314" r="7" fill="#efc66c"/><rect x="10" y="350" width="300" height="104" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5"/><text x="25" y="377" font-size="18" fill="#efc66c" font-weight="650" text-anchor="start">CC64</text><text x="85" y="377" font-size="18" fill="#f2eee6" font-weight="650" text-anchor="start">Pedal de sustentação</text><text x="25" y="402" font-size="16" fill="#c0bbb2" font-weight="400" text-anchor="start">Sustente após soltar as notas</text><text x="25" y="434" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="start">0–63 Desl.</text><text x="290" y="434" font-size="17" fill="#efc66c" font-weight="650" text-anchor="end">64–127 Lig.</text></g>
</svg>
