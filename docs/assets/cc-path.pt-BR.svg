<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 460" width="320" height="460" role="img" aria-labelledby="cc-visual-path-pt-br-title" aria-describedby="cc-visual-path-pt-br-desc" focusable="false" lang="pt-BR">
<title id="cc-visual-path-pt-br-title">O caminho dos controladores no MS Basic</title>
<desc id="cc-visual-path-pt-br-desc">108 números de controlador editáveis podem ser enviados ao MS Basic. O instrumento da SoundFont determina o efeito. Os 20 controladores protegidos nunca são enviados. Muse Sounds, VST3 e MIDI externo não aceitam essas faixas genéricas.</desc>
<rect width="320" height="460" rx="8" fill="#1b1d21"/><g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect x="10" y="10" width="300" height="54" rx="10" fill="#1b1d21" stroke="#efc66c" stroke-width="1.5"/><text x="160" y="44" font-size="20" fill="#efc66c" font-weight="650" text-anchor="middle">108 faixas de CC editáveis</text><line x1="160" y1="72" x2="160" y2="96" stroke="#efc66c" stroke-width="3"/><path d="M154 90 L160 97 L166 90" fill="none" stroke="#efc66c" stroke-width="3" stroke-linejoin="round"/><rect x="10" y="108" width="300" height="62" rx="10" fill="#1b1d21" stroke="#efc66c" stroke-width="1.5"/><text x="160" y="136" font-size="23" fill="#f2eee6" font-weight="650" text-anchor="middle">MS Basic</text><text x="160" y="160" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="middle">Reprodução com SoundFont</text><line x1="160" y1="180" x2="160" y2="204" stroke="#efc66c" stroke-width="3"/><path d="M154 198 L160 205 L166 198" fill="none" stroke="#efc66c" stroke-width="3" stroke-linejoin="round"/><rect x="10" y="218" width="300" height="54" rx="10" fill="#1b1d21" stroke="#efc66c" stroke-width="1.5"/><text x="160" y="252" font-size="20" fill="#f2eee6" font-weight="650" text-anchor="middle">Instrumento selecionado</text><text x="160" y="300" font-size="18" fill="#c0bbb2" font-weight="400" text-anchor="middle">A resposta depende</text><text x="160" y="324" font-size="18" fill="#c0bbb2" font-weight="400" text-anchor="middle">do som escolhido.</text><rect x="10" y="344" width="300" height="56" rx="10" fill="#1b1d21" stroke="#56524a" stroke-width="1.5" stroke-dasharray="5 4"/><text x="160" y="368" font-size="18" fill="#f2eee6" font-weight="600" text-anchor="middle">20 controladores protegidos</text><text x="160" y="390" font-size="17" fill="#c0bbb2" font-weight="400" text-anchor="middle">Nunca enviados</text><text x="160" y="425" font-size="15" fill="#c0bbb2" font-weight="400" text-anchor="middle">Outras fontes: sem CC genérico</text><text x="160" y="446" font-size="14" fill="#c0bbb2" font-weight="400" text-anchor="middle">Muse Sounds · VST3 · MIDI externo</text></g>
</svg>
